[package]
name = "harness2-rs"
version = "0.1.0"
edition = "2021"
description = "Rust-native core of Harness²: harness surface validation"
license = "Apache-2.0"

[dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
